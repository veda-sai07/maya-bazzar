# Optional: starts a MySQL 8 server that matches the backend's default settings.
services:
  mysql:
    image: mysql:8.0
    container_name: maya-bazzar-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopdb
    ports:
      - "3306:3306"
    volumes:
      - maya-bazzar-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  maya-bazzar-data:
